defaults:
  dashboard: xconnect_dashboard_v3

Kamailio Alive:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  panel_id: 22
  floor_value: 1
  floor_op: <
  description: "XCC alive stats by XCC instance (up/down status)"
Kamailio Instance Restarts:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  expr: present_over_time(process_start_time_seconds{region="$region",role="edgerouter",service="kamailio"}[5m])
  floor_value: 0
  floor_op: ">"
  description: "Kamailio instance up/down per instance (1=up, 0=down). Terminate = a line drops 1->0; start = a line rises 0->1. Restart = one instance drops while another rises."
  render:
    min: 0
    max: 2
    style: state
Error Rates (Spikes) - By Instance:
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 800
  floor_value: 2
  floor_op: >
  description: "XCC error rates (spikes) by XCC instance"
Custom Metrics Rates (Spikes) - By Instance:
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 801
  floor_value: 7
  floor_op: >
  description: "XCC custom metrics rates (spikes) by XCC instance"
Custom Metrics Rates (Spikes):
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 232
  floor_value: 20
  floor_op: >
  description: "XCC custom metrics rates (spikes)"
Error Rates (Spikes):
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 231
  floor_value: 4
  floor_op: >
  description: "XCC error rates (spikes)"
CPU Stats:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 11
  deviation_threshold: 300
