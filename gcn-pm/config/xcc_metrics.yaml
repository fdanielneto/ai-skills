  "C \u2014 IOWait": cpu_usage_iowait{region="$region",role=~"edgerouter",cpu="cpu-total"}
  "D \u2014 Guest": cpu_usage_guest{region="$region",role=~"edgerouter",cpu="cpu-total"}
