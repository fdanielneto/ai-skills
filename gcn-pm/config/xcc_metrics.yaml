defaults:
  dashboard: xconnect_dashboard_v3

XCC Alive:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  panel_id: 22
  floor_value: 1
  floor_op: "<"
  description: "XCC alive stats by XCC instance (up/down status)"
XCC Instance Restarts:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  expr: present_over_time(process_start_time_seconds{region="$region",role="edgerouter",service="XCC"}[5m])
  floor_value: 0
  floor_op: ">"
  description: "Kamailio instance up/down per instance (1=up, 0=down). Terminate = a line drops 1->0; start = a line rises 0->1. Restart = one instance drops while another rises."
  render:
    min: 0
    max: 2
    style: state
Error Rates (Spikes) - By Instance:
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 800
  floor_value: 2
  floor_op: ">"
  description: "XCC error rates (spikes) by XCC instance"
  series_floor:
    total_error_rate: 3    # acima do max observado por instância ~2.40
    "4xx_rate": 2.5        # acima do p99.9 ~1.55
    "5xx_rate": 1.5        # acima do p99.9 ~0.94
    "6xx_rate": 0.1        # acima do p99.9 ~0.034 (6xx deve ser raríssimo)
Custom Metrics Rates (Spikes) - By Instance:
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 801
  floor_value: 7
  floor_op: ">"
  description: "XCC custom metrics rates (spikes) by XCC instance"
  series_floor:
    emergency_invites_rate: 5   # sem dados históricos (0 séries) — valor conservador
    inbound_invites_rate: 4     # acima do p99.9 ~2.87
    outbound_offnet_rate: 6     # acima do p99.9 ~4.86
    outbound_onnet_rate: 0.05   # acima do p99.9 ~0.008
    rtpengine_failure_rate: 0.1 # acima do p99.9 ~0.008
    siprec_calls_rate: 5        # sem dados históricos — valor conservador
Custom Metrics Rates (Spikes):
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 232
  floor_value: 20
  floor_op: ">"
  description: "XCC custom metrics rates (spikes)"
  series_floor:
    total_custom_rate: 20                    # sem dados históricos (0 séries) — mantém o floor da métrica
    emergency_invites_rate: 5                # sem dados históricos (0 séries) — valor conservador
    inbound_invites_rate: 9                  # acima do p99.9 ~8.03
    outbound_offnet_invites_rate: 11         # acima do p99.9 ~8.66
    outbound_onnet_invites_rate: 0.05        # acima do p99.9 ~0.012 (baseline quase-zero)
    rtpengine_connection_failure_rate: 0.1   # acima do p99.9 ~0.010
    siprec_calls_rate: 5                     # sem dados históricos (0 séries) — valor conservador
Error Rates (Spikes):
  status: active
  deviation: SPIKE
  data_view: chart
  panel_id: 231
  floor_value: 4
  floor_op: ">"
  description: "XCC error rates (spikes)"
  series_floor:
    total_error_rate: 6    # acima do max observado ~5.25
    "4xx_rate": 3          # acima do p99.9 ~2.81
    "5xx_rate": 2          # acima do p99.9 ~1.92
    "6xx_rate": 0.15       # acima do p99.9 ~0.058 (6xx deve ser raríssimo)
XCC CPU Stats:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 11
  deviation_threshold: 300
  floor_value: 10
  floor_op: ">"
  description: "XCC CPU stats"
  series_floor:
    user: 3      # sem dados históricos (query "A — User" nunca devolveu séries); consistente com 'system' por precaução
    system: 3    # baseline p99.9 ~0.77, max ~1.0
    iowait: 1    # baseline p99.9 ~0.21, max ~0.26
    guest: 1     # baseline sempre 0
XCC System Load:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 9
  deviation_threshold: 300
  floor_value: 2.5
  floor_op: ">"
  description: "XCC system load stats"
  series_floor:
    cpu_count: null   # constante (nº de CPUs da instância) — nunca alertar
    # load_1m/load_5m/load_15m: sem entrada, ficam no floor_value:2.5 da
    # métrica — já bem calibrado para os três (baseline max ~2.0)
XCC CPU Usage per Process:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 14
  deviation_threshold: 300
  floor_value: 15
  floor_op: ">"
  description: "XCC CPU usage per process stats"
XCC Memory Usage per Process:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 16
  deviation_threshold: 300
  floor_value: 2.5
  floor_op: ">"
  description: "XCC memory usage per process stats"
XCC Memory Usage:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 4
  deviation_threshold: 300
  floor_value: 60
  floor_op: ">"
  description: "XCC memory usage stats"
  series_floor:
    total: null              # constante (RAM total ~8GB)
    active: 2000000000       # ~2GB, acima do p99.9 ~1.82GB
    cache_buffers: 6300000000  # acima do p99.9 ~6.10GB
    swap: 50000000            # sem dados históricos (0 séries em todas as regiões) — valor conservador
    # free: sem entrada — floor_op ">" não serve para "alertar quando free é
    # baixo" (limitação conhecida, ver README/plano); fica no floor_value:60
    # da métrica (hoje inofensivo/no-op para esta série)
XCC Network IO:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 10
  deviation_threshold: 300
  floor_value: 1000000
  floor_op: ">"
  description: "XCC network IO stats"
XCC Number of File Handles:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 17
  deviation_threshold: 300
  # Interim estimate, sem dados históricos: ~80% de um ulimit -n comum (65536)
  # tuned em instâncias de produção. Confirmar o ulimit real e ajustar.
  floor_value: 50000
  floor_op: ">"
  description: "XCC number of file handles stats"
XCC Disk Usage:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 61
  deviation_threshold: 300
  floor_value: 80
  floor_op: ">"
  description: "XCC disk usage stats"
XCC TCP Connection Counters:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 8
  deviation_threshold: 300
  # Interim estimate, sem dados históricos: 1 milhão de ligações TCP
  # simultâneas é implausível para este tipo de instância; ordem de grandeza
  # a confirmar com o volume real observado no painel.
  floor_value: 30000
  floor_op: ">"
  description: "XCC TCP connection counters stats"
XCC Core SHMem Max Used:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 6
  deviation_threshold: 300
  # Interim estimate, sem dados históricos: assume bytes; Kamailio -m
  # tipicamente configurado entre 64MB e 1GB+, floor original (~1MB) ficava
  # sempre abaixo do uso normal. Confirmar o -m real configurado e ajustar.
  floor_value: 800000000
  floor_op: ">"
  description: "XCC core SHMem max used stats"
XCC RTPEngine Connection Failures:
  status: active
  deviation: RESOURCE
  data_view: chart
  panel_id: 68
  deviation_threshold: 300
  # Interim estimate, sem dados históricos: "falhas de ligação" deve alertar
  # com contagens pequenas, não milhões. Se a query devolver um contador
  # bruto/monotónico (não uma rate), este floor absoluto não é uma boa
  # estratégia de deteção de qualquer forma — confirmar se usa rate()/irate().
  floor_value: 50
  floor_op: ">"
  description: "XCC RTPEngine connection failures stats"