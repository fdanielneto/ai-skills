defaults:
  dashboard: xconnect_dashboard_v3

"Version and Instance type":
  status: active
  data_view: table
  panel_id: 12
  description: "XCC version and instance type by XCC instance"
Kamailio Alive:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  panel_id: 22
  floor_value: 1
  floor_op: <
  description: "XCC alive stats by XCC instance (up/down status)"
Kamailio Instance Restarts:
  status: active
  deviation: STATE
  data_view: chart_not_zoom
  expr: present_over_time(process_start_time_seconds{region="$region",role="edgerouter",service="kamailio"}[5m])
  floor_value: 0
  floor_op: ">"
  description: "Kamailio instance up/down per instance (1=up, gap=down). Restart = an instance disappears while a new instance appears."
  render:
    min: 0
    max: 1
